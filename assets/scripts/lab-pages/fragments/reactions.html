<!--META {"dir":"reactions","tool":"reactions","title":"Reaction Studio","h1":"Reaction Animation Studio","sub":"Nine curated reactions with Play, Pause, Replay and step controls. Each animation shows the overall change, not the mechanism.","desc":"Organic Chemistry Reaction Animation Studio: combustion, substitution, addition, hydrogenation, halogenation, hydration, dehydration, polymerization and esterification.","keywords":"Organic Chemistry Reactions, Combustion, Substitution, Addition, Esterification, Reaction Animation, Hamad Khan, Hamad Gopang, Chemistry Educator, Matriculation, Alipur, Pakistan","scripts":["lab-core.js","lab-teacher.js","lab-reactions.js"]}-->
        <div class="rx-layout">
          <div class="lab-panel rx-list-panel">
            <span class="lab-label" id="rxListLabel">Choose a reaction</span>
            <ul class="rx-list" id="rxList" role="listbox" aria-labelledby="rxListLabel"></ul>
          </div>

          <div class="lab-panel rx-main">
            <div class="rx-head">
              <div>
                <span class="lab-eyebrow" id="rxType"></span>
                <h2 id="rxName"></h2>
              </div>
              <p class="equation-line" id="rxEquation"></p>
            </div>

            <div class="mol-stage mol-stage--react" id="rxStage" aria-live="polite"></div>

            <div class="rx-controls">
              <button type="button" class="lab-btn lab-btn--teal" id="rxPlay">Play</button>
              <button type="button" class="lab-btn lab-btn--ghost" id="rxPause">Pause</button>
              <button type="button" class="lab-btn lab-btn--ghost" id="rxReplay">Replay</button>
              <button type="button" class="lab-btn lab-btn--ghost" id="rxPrev">Previous step</button>
              <button type="button" class="lab-btn lab-btn--ghost" id="rxNext">Next step</button>
            </div>

            <div class="rx-step" aria-live="polite">
              <p class="lab-chip" id="rxStepNum">Step 1 of 3</p>
              <h3 id="rxStepTitle">Reactants</h3>
              <p id="rxStepText"></p>
            </div>

            <div class="rx-meta">
              <p id="rxConditions"></p>
              <p id="rxExplain"></p>
              <p class="lab-note" id="rxMechanism"></p>
              <p class="lab-note is-safety" id="rxSafety"></p>
            </div>
          </div>
        </div>
