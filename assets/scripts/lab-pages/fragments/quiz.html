        <div class="qz-layout">
          <div class="lab-panel qz-setup" id="qzSetup">
            <div class="lab-field">
              <span class="lab-label" id="qzTopicLabel">Topic</span>
              <div class="lab-seg" id="qzTopic" role="group" aria-labelledby="qzTopicLabel"></div>
            </div>
            <div class="lab-field">
              <span class="lab-label" id="qzLevelLabel">Difficulty</span>
              <div class="lab-seg" id="qzLevel" role="group" aria-labelledby="qzLevelLabel"></div>
            </div>
            <div class="lab-field lab-field--row">
              <label class="lab-check"><input type="checkbox" id="qzTimer"> <span>Optional timer (60s per question)</span></label>
              <label class="lab-check"><input type="checkbox" id="qzShuffle" checked> <span>Random order</span></label>
            </div>
            <p class="lab-muted" id="qzCount">0 questions match these filters.</p>
            <button type="button" class="lab-btn lab-btn--amber" id="qzStart">Start quiz</button>
            <p class="lab-note" id="qzBest">Best score for this filter: not taken yet.</p>
          </div>

          <div class="lab-panel qz-play" id="qzPlay" hidden>
            <div class="qz-progress">
              <span id="qzIndex">Question 1</span>
              <span id="qzScoreLive">Score 0</span>
              <span id="qzTime" hidden></span>
            </div>
            <h2 id="qzPrompt"></h2>
            <div class="mol-stage mol-stage--sm" id="qzMol" hidden></div>
            <div id="qzInput"></div>
            <p class="lab-note" id="qzFeedback" hidden></p>
            <div class="qz-actions">
              <button type="button" class="lab-btn lab-btn--teal" id="qzCheck">Check answer</button>
              <button type="button" class="lab-btn lab-btn--ghost" id="qzNextQ" hidden>Next</button>
            </div>
          </div>

          <div class="lab-panel qz-summary" id="qzSummary" hidden>
            <h2>Quiz summary</h2>
            <p id="qzSummaryText"></p>
            <ul class="lab-list" id="qzSummaryList"></ul>
            <div class="qz-actions">
              <button type="button" class="lab-btn lab-btn--amber" id="qzRetryWrong">Retry incorrect</button>
              <button type="button" class="lab-btn lab-btn--teal" id="qzAgain">New quiz</button>
            </div>
          </div>
        </div>
